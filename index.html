<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <script>
      if (window.HarborAndroid) {
        // Native Android app: a real phone viewport (no desktop-width shrink, no pinch zoom).
        document.documentElement.setAttribute('data-phone', 'true');
        document.write('<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">');
      } else if (/Android|webOS|iPhone|iPod|BlackBerry|IEMobile|Opera Mini|iPad/i.test(navigator.userAgent) || (navigator.maxTouchPoints > 0 && Math.min(window.innerWidth, window.innerHeight) < 640)) {
        document.write('<meta name="viewport" content="width=850, user-scalable=yes, viewport-fit=cover">');
      } else {
        document.write('<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">');
      }
    </script>
    <meta name="theme-color" content="#160717" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Harbor" />
    <link rel="apple-touch-icon" href="/favicon.png" />
    <meta name="robots" content="noindex, nofollow, noarchive, nosnippet, noimageindex" />
    <meta name="googlebot" content="noindex, nofollow, noarchive, nosnippet, noimageindex" />
    <meta name="referrer" content="no-referrer" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="manifest" href="/manifest.json" />
    <script>
      if ('serviceWorker' in navigator && !window.HarborAndroid) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').catch(err => console.log('SW setup failed', err));
        });
      }
    </script>
    <title>Harbor</title>
    <link rel="preconnect" href="https://image.tmdb.org" />
    <link rel="preconnect" href="https://images.metahub.space" />
    <link rel="preconnect" href="https://api.themoviedb.org" crossorigin />
    <link rel="preconnect" href="https://v3-cinemeta.strem.io" crossorigin />
    <link rel="preconnect" href="https://api.strem.io" crossorigin />
    <link rel="dns-prefetch" href="https://www.omdbapi.com" />
    <link rel="dns-prefetch" href="https://www.youtube-nocookie.com" />
    <!-- Fonts ship with the app (scripts/fetch-web-fonts.mjs): no CDN can hold up the first paint. -->
    <link rel="stylesheet" href="/fonts/fonts.css" />
    <script>
      // Uncaught errors are only drawn on screen when debugging is switched on by hand
      // (localStorage "harbor.debugErrors" = "1"); otherwise they go to the console only.
      (function () {
        var on = false;
        try { on = localStorage.getItem('harbor.debugErrors') === '1'; } catch (e) {}
        if (!on) return;
        function show(title, text, color) {
          var d = document.createElement('div');
          d.style.cssText = 'position:fixed;top:0;left:0;right:0;z-index:999999;padding:12px;color:#fff;font:12px/1.4 monospace;word-break:break-all;background:' + color;
          d.textContent = title + ' ' + text;
          d.addEventListener('click', function () { d.remove(); });
          (document.body || document.documentElement).appendChild(d);
        }
        window.addEventListener('error', function (e) {
          show('JS Error:', String(e.message) + ' at ' + e.filename + ':' + e.lineno + ':' + e.colno + ' ' + ((e.error && e.error.stack) || ''), '#8b0000');
        });
        window.addEventListener('unhandledrejection', function (e) {
          show('Promise Rejection:', String(e.reason) + ' ' + ((e.reason && e.reason.stack) || ''), '#b22222');
        });
      })();
    </script>
    <style>
      /* The default theme's canvas (--color-canvas in src/index.css): the first frame and the
         splash already have the app's colour, so nothing flashes when the page takes over. */
      html, body, #root {
        background: #160717;
        color-scheme: dark;
        margin: 0;
        height: 100%;
      }
      #harbor-boot {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #160717;
        z-index: 9999;
        pointer-events: none;
        transition: opacity 280ms ease-out;
      }
      #harbor-boot.gone { opacity: 0; }
      #harbor-boot svg {
        width: 96px;
        height: auto;
        color: #f5f5f5;
        filter: drop-shadow(0 10px 30px rgba(232, 170, 108, 0.22));
        transform-origin: center 65%;
        animation:
          harborBootBob 2400ms ease-in-out infinite,
          harborBootGlow 2400ms ease-in-out infinite;
      }
      @keyframes harborBootBob {
        0%   { transform: translateY(0)    rotate(-2deg) scale(0.98); }
        25%  { transform: translateY(-3px) rotate( 0deg) scale(1.00); }
        50%  { transform: translateY(0)    rotate( 2deg) scale(1.02); }
        75%  { transform: translateY(-3px) rotate( 0deg) scale(1.00); }
        100% { transform: translateY(0)    rotate(-2deg) scale(0.98); }
      }
      @keyframes harborBootGlow {
        0%, 100% { opacity: 0.78; }
        50%      { opacity: 1; }
      }
    </style>
    <script>
      (function () {
        try {
          var p = new URLSearchParams(window.location.search);
          if (p.get('harbor-modal') === '1') {
            var s = document.createElement('style');
            s.textContent = '#harbor-boot{display:none !important}';
            document.head.appendChild(s);
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="harbor-boot">
      <svg viewBox="0 0 700 642.88" fill="currentColor" aria-hidden="true">
        <g transform="matrix(0.13333333,0,0,-0.13333333,0,642.88)">
          <path d="m 72.0781,1534.27 c 0,0 1127.5819,922.03 1526.9319,2636.89 0,0 463.95,-1274.4 17.61,-2625.15 L 72.0781,1534.27" />
          <path d="M 3975.59,2945.05 2812.18,2222.26 c -36.68,-22.79 -84.13,3.59 -84.13,46.78 v 1391.45 c 0,42.35 45.8,68.85 82.51,47.75 l 1163.41,-668.68 c 36.11,-20.75 37,-72.53 1.62,-94.51 z M 2021.85,4821.57 V 1438.84 l 2818.94,416.96 c 0,0 252.54,2501.82 -2818.94,2965.77" />
          <path d="m 615.313,4.40234 c 0,0 -364.817,308.39866 -604.4224,706.25766 -28.3125,47.012 1.4922,107.77 55.8555,115.281 L 5090.13,1520.12 c 57.31,7.92 102.66,-47.69 82.95,-102.09 C 5065.81,1122 4746.77,351.742 4222.68,0 L 615.313,4.40234" />
        </g>
      </svg>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
