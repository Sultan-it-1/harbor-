    <meta charset="UTF-8" />
    <script>
      if (window.HarborAndroid) {
        // Native Android app: a real phone viewport (no desktop-width shrink, no pinch zoom).
        document.documentElement.setAttribute('data-phone', 'true');
        document.write('<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">');
      } else if (/Android|webOS|iPhone|iPod|BlackBerry|IEMobile|Opera Mini|iPad/i.test(navigator.userAgent) || (navigator.maxTouchPoints > 0 && Math.min(window.innerWidth, window.innerHeight) < 640)) {
        document.write('<meta name="viewport" content="width=850, user-scalable=yes, viewport-fit=cover">');
      } else {
        document.write('<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">');
      }
    </script>

    <script>
      window.onerror = function(message, source, lineno, colno, error) {
        var errDiv = document.createElement('div');
        errDiv.style.position = 'fixed';
        errDiv.style.top = '0';
        errDiv.style.left = '0';
        errDiv.style.width = '100%';
        errDiv.style.backgroundColor = '#8b0000';
        errDiv.style.color = 'white';
        errDiv.style.zIndex = '999999';
        errDiv.style.padding = '15px';
        errDiv.style.fontFamily = 'monospace';
        errDiv.style.fontSize = '12px';
        errDiv.style.wordBreak = 'break-all';
        errDiv.innerHTML = '<strong>JS Error:</strong> ' + message + ' <br>at ' + source + ':' + lineno + ':' + colno + '<br>Stack: ' + (error && error.stack || 'none');
        document.body.appendChild(errDiv);
      };
      window.addEventListener('unhandledrejection', function(event) {
        var errDiv = document.createElement('div');
        errDiv.style.position = 'fixed';
        errDiv.style.top = '0';
        errDiv.style.left = '0';
        errDiv.style.width = '100%';
        errDiv.style.backgroundColor = '#b22222';
        errDiv.style.color = 'white';
        errDiv.style.zIndex = '999999';
        errDiv.style.padding = '15px';
        errDiv.style.fontFamily = 'monospace';
        errDiv.style.fontSize = '12px';
        errDiv.style.wordBreak = 'break-all';
        errDiv.innerHTML = '<strong>Promise Rejection:</strong> ' + event.reason + '<br>Stack: ' + (event.reason && event.reason.stack || 'none');
        document.body.appendChild(errDiv);
      });
    </script>
    <style>
      html, body, #root {
        background: #0a0a0a;
        color-scheme: dark;
        margin: 0;
        height: 100%;
      }
      #harbor-boot {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #0a0a0a;
        z-index: 9999;
        pointer-events: none;
        transition: opacity 280ms ease-out;
      }
      #harbor-boot.gone { opacity: 0; }
      #harbor-boot svg {
        width: 96px;
        height: auto;
        color: #f5f5f5;
        filter: drop-shadow(0 10px 30px rgba(232, 170, 108, 0.22));
        transform-origin: center 65%;
        animation:
          harborBootBob 2400ms ease-in-out infinite,
          harborBootGlow 2400ms ease-in-out infinite;
      }
      @keyframes harborBootBob {
        0%   { transform: translateY(0)    rotate(-2deg) scale(0.98); }
        25%  { transform: translateY(-3px) rotate( 0deg) scale(1.00); }
        50%  { transform: translateY(0)    rotate( 2deg) scale(1.02); }
        75%  { transform: translateY(-3px) rotate( 0deg) scale(1.00); }
        100% { transform: translateY(0)    rotate(-2deg) scale(0.98); }
      }
      @keyframes harborBootGlow {
        0%, 100% { opacity: 0.78; }
        50%      { opacity: 1; }
      }
    </style>
    <script>
      (function () {
        try {
          var p = new URLSearchParams(window.location.search);
          if (p.get('harbor-modal') === '1') {
            var s = document.createElement('style');
            s.textContent = '#harbor-boot{display:none !important}';
            document.head.appendChild(s);
          }
        } catch (e) {}
      })();
    </script>
