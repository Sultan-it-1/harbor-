name: ios-build

# The iPhone app: Harbor's web UI in the iOS shell (ios/). Every push that touches it builds an
# unsigned IPA (SideStore / AltStore sign it on the phone), then runs the app in the iPhone
# simulator and keeps screenshots and the app's log, since nobody here has an iPhone to try it on.
# Run by hand only (Actions tab -> ios-build -> Run workflow): while the native iOS screens are
# being written, pushes don't build (each build uses Mac minutes).
on:
  workflow_dispatch:

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

# Publishes each build as a pre-release (the repository's storage for build files is full).
permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 9

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Web UI
        run: |
          pnpm install --frozen-lockfile
          pnpm run build

      - name: iOS shell
        working-directory: ios
        run: |
          npm ci --no-audit --no-fund
          npx cap sync ios
          # The player's engine (MobileVLCKit) comes through CocoaPods.
          cd native/App && pod install --repo-update

      - name: Build the app (unsigned IPA)
        working-directory: ios/native/App
        run: |
          set -o pipefail
          VERSION=$(node -p "require('../../../package.json').version")
          # Every compiler error at once (not only the last lines), so one run shows them all.
          if ! xcodebuild -workspace App.xcworkspace -scheme App -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/device" \
            MARKETING_VERSION="$VERSION" CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build > "$RUNNER_TEMP/build.log" 2>&1; then
            echo "::group::Compiler errors"
            grep -E ": (error|fatal error):" "$RUNNER_TEMP/build.log" | sed -E 's#^.*/ios/native/App/##' | sort -u | head -n 400
            echo "::endgroup::"
            tail -n 40 "$RUNNER_TEMP/build.log"
            exit 1
          fi
          tail -n 15 "$RUNNER_TEMP/build.log"
          mkdir -p "$RUNNER_TEMP/ipa/Payload"
          cp -R "$RUNNER_TEMP/device/Build/Products/Release-iphoneos/App.app" "$RUNNER_TEMP/ipa/Payload/"
          (cd "$RUNNER_TEMP/ipa" && zip -qry "$GITHUB_WORKSPACE/harbor-ios.ipa" Payload)
          ls -la "$GITHUB_WORKSPACE/harbor-ios.ipa"

      - name: Run it in the iPhone simulator
        working-directory: ios/native/App
        run: |
          set -o pipefail
          xcodebuild -workspace App.xcworkspace -scheme App -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/sim" CODE_SIGNING_ALLOWED=NO \
            build | tail -n 20
          APP="$RUNNER_TEMP/sim/Build/Products/Debug-iphonesimulator/App.app"
          # The newest iPhone the runner has, a Pro (a notch / Dynamic Island) when there is one.
          UDID=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          devs = json.load(sys.stdin)["devices"]
          for runtime in sorted((k for k in devs if "iOS" in k), reverse=True):
              phones = [d for d in devs[runtime] if d["name"].startswith("iPhone")]
              pros = [d for d in phones if "Pro" in d["name"]]
              if phones:
                  print((pros or phones)[-1]["udid"]); break
          ')
          echo "Simulator: $UDID"
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl install "$UDID" "$APP"
          xcrun simctl launch "$UDID" app.harbor.ios
          mkdir -p "$GITHUB_WORKSPACE/simulator"
          sleep 20
          xcrun simctl io "$UDID" screenshot "$GITHUB_WORKSPACE/simulator/1-after-20s.png"
          sleep 20
          xcrun simctl io "$UDID" screenshot "$GITHUB_WORKSPACE/simulator/2-after-40s.png"
          # What the page logged (Capacitor passes console messages to the system log).
          xcrun simctl spawn "$UDID" log show --last 3m --style compact \
            --predicate 'process == "App"' > "$GITHUB_WORKSPACE/simulator/app.log" || true
          # The page's own messages and errors (not WebKit's loading chatter).
          grep -E "⚡️|\[error\]|\[warn\]|JS Eval|Unhandled|TypeError|ReferenceError" \
            "$GITHUB_WORKSPACE/simulator/app.log" | grep -v "com.apple.WebKit" | tail -n 120 || true

          echo "SIM_UDID=$UDID" >> "$GITHUB_ENV"

      # The player in the simulator (a failure here doesn't stop the build from being published).
      - name: Player test in the simulator
        continue-on-error: true
        run: |
          UDID="$SIM_UDID"
          # An MKV with Dolby (AC3) audio and an Arabic subtitle file in the old
          # Windows-1256 encoding (common for Arabic subtitles), served from the runner.
          command -v ffmpeg >/dev/null || brew install ffmpeg >/dev/null
          mkdir -p "$RUNNER_TEMP/media" && cd "$RUNNER_TEMP/media"
          printf '1\r\n00:00:01,000 --> 00:01:00,000\r\nهذه ترجمة عربية للتجربة\r\n\r\n' | iconv -f UTF-8 -t CP1256 > sub-ar.srt
          ffmpeg -loglevel error -y -f lavfi -i testsrc2=size=1280x720:rate=24 \
            -f lavfi -i sine=frequency=440:sample_rate=48000 -t 60 \
            -c:v libx264 -preset ultrafast -pix_fmt yuv420p -c:a ac3 -ac 6 test.mkv
          (python3 -m http.server 8765 >/dev/null 2>&1 &)
          sleep 2
          xcrun simctl terminate "$UDID" app.harbor.ios || true
          xcrun simctl launch --console-pty "$UDID" app.harbor.ios -HarborPlayerTest \
            "http://127.0.0.1:8765/test.mkv" "http://127.0.0.1:8765/sub-ar.srt" > "$GITHUB_WORKSPACE/simulator/player.log" 2>&1 &
          sleep 5
          xcrun simctl io "$UDID" screenshot "$GITHUB_WORKSPACE/simulator/3-player.png"
          sleep 9
          xcrun simctl io "$UDID" screenshot "$GITHUB_WORKSPACE/simulator/4-player-later.png"
          # Stop the app (and its console) so the log is complete before it's published.
          xcrun simctl terminate "$UDID" app.harbor.ios || true
          sleep 2
          grep "harbor player" "$GITHUB_WORKSPACE/simulator/player.log" | tail -n 30 || true
          grep -iE "subtitle|subsdec|freetype|slave|srt" "$GITHUB_WORKSPACE/simulator/player.log" | grep -v "harbor player" | tail -n 40 || true

      # The screens in English and in Arabic: the app opens each one by itself (-HarborTour, test
      # builds only) and names it in a file once it has filled; a screenshot each time the name changes.
      - name: Screens tour in the simulator
        continue-on-error: true
        run: |
          UDID="$SIM_UDID"
          OUT="$GITHUB_WORKSPACE/simulator/tour"
          mkdir -p "$OUT"
          DATA=$(xcrun simctl get_app_container "$UDID" app.harbor.ios data)
          for L in en ar; do
            xcrun simctl terminate "$UDID" app.harbor.ios || true
            rm -f "$DATA/Documents/tour/step.txt"
            xcrun simctl launch --console-pty "$UDID" app.harbor.ios -HarborTour "$L" > "$GITHUB_WORKSPACE/simulator/tour-$L.log" 2>&1 &
            last=""
            for i in $(seq 1 600); do
              step=$(cat "$DATA/Documents/tour/step.txt" 2>/dev/null || true)
              if [ -n "$step" ] && [ "$step" != "$last" ]; then
                last="$step"
                [ "$step" = "done" ] && break
                xcrun simctl io "$UDID" screenshot "$OUT/$L-$step.png" >/dev/null 2>&1
                sips -Z 1434 "$OUT/$L-$step.png" >/dev/null 2>&1 || true
                echo "$L $step"
              fi
              sleep 0.5
            done
            xcrun simctl terminate "$UDID" app.harbor.ios || true
          done
          sleep 2
          xcrun simctl spawn "$UDID" log show --last 12m --style compact \
            --predicate 'process == "App"' > "$GITHUB_WORKSPACE/simulator/tour-app.log" || true
          grep -E "\[error\]|\[warn\]|JS Eval|Unhandled|TypeError|ReferenceError|harbor native" \
            "$GITHUB_WORKSPACE/simulator/tour-app.log" | grep -v "com.apple.WebKit" | tail -n 80 || true
          ls "$OUT"

      - name: Publish (pre-release)
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ios-build-${{ github.run_number }}
          name: iOS build ${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          prerelease: true
          make_latest: "false"
          body: |
            Unsigned IPA for SideStore / AltStore, and the iPhone simulator's screenshots and log.
          files: |
            harbor-ios.ipa
            simulator/1-after-20s.png
            simulator/2-after-40s.png
            simulator/3-player.png
            simulator/4-player-later.png
            simulator/app.log
            simulator/player.log
            simulator/tour/*.png
            simulator/tour-*.log
