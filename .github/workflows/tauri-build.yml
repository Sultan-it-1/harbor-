name: tauri-build

# The Windows desktop app (Harbor App), built by hand from the Actions tab or the API: nothing
# here runs on a push. Only Windows is built: this repository is private, so every runner
# minute counts against the account's monthly allowance (Windows counts double, macOS ten times).
on:
  workflow_dispatch:

permissions:
  contents: read

# One build per branch at a time: a newer request replaces one still running.
concurrency:
  group: tauri-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_OPTIONS: --max-old-space-size=6144
  # The web UI's "beta" badge is off unless the channel says otherwise.
  HARBOR_CHANNEL: stable

jobs:
  windows:
    name: Windows (x86_64-pc-windows-msvc)
    runs-on: windows-latest
    timeout-minutes: 120
    env:
      TARGET: x86_64-pc-windows-msvc

    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            harbor-core
            src-tauri

      - uses: pnpm/action-setup@v6
        with:
          version: 9

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install JS deps
        shell: bash
        run: |
          # One dependency comes from GitHub by an ssh:// address; fetch it over https instead.
          git config --global --add url."https://github.com/".insteadOf "ssh://git@github.com/"
          pnpm install --frozen-lockfile

      - name: Check Arabic translations
        run: pnpm run check:i18n

      # libmpv-2.dll (the player) and mpv.exe (thumbnails, recordings), both pinned by checksum.
      - name: Fetch libmpv and mpv
        run: |
          pnpm run setup:libmpv
          pnpm run setup:mpv

      - name: Fetch yt-dlp, ffmpeg and ffprobe
        shell: bash
        run: |
          mkdir -p src-tauri/binaries
          cd src-tauri/binaries
          curl --retry 6 --retry-delay 4 --retry-all-errors -fsSL "https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp.exe" -o "yt-dlp-${TARGET}.exe"
          curl --retry 6 --retry-delay 4 --retry-all-errors -fsSL "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip" -o ffmpeg.zip
          unzip -q -j ffmpeg.zip "*/bin/ffmpeg.exe" "*/bin/ffprobe.exe"
          rm ffmpeg.zip
          mv ffmpeg.exe "ffmpeg-${TARGET}.exe"
          mv ffprobe.exe "ffprobe-${TARGET}.exe"
          ls -la

      - name: Build the app and its installer
        run: pnpm tauri build --target x86_64-pc-windows-msvc --bundles nsis

      - name: Find the installer
        id: installer
        shell: bash
        run: |
          EXE=$(ls src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe | head -1)
          [ -n "$EXE" ] || { echo "::error::no installer was made"; exit 1; }
          ls -la "$EXE"
          echo "SHA-256: $(sha256sum "$EXE" | cut -d' ' -f1)"
          echo "path=$EXE" >> "$GITHUB_OUTPUT"

      # The installer itself (not a zip): it downloads as the .exe.
      - uses: actions/upload-artifact@v7
        with:
          path: ${{ steps.installer.outputs.path }}
          archive: false
          retention-days: 14
          if-no-files-found: error
