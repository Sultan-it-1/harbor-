name: android-build

on:
  workflow_dispatch:
  push:
    paths:
      - "android/**"
      - "src/**"
      - "public/**"
      - "index.html"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/android-build.yml"

permissions:
  contents: write

# One build per branch at a time: a newer push replaces one still running, so two builds of the
# same branch can't race to publish.
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install JS deps
        run: |
          # mpegts.js pulls a dependency straight from GitHub; never try SSH for it.
          git config --global url."https://github.com/".insteadOf "git@github.com:"
          git config --global --add url."https://github.com/".insteadOf "ssh://git@github.com/"
          pnpm install --frozen-lockfile

      - name: Check Arabic translations
        run: pnpm run check:i18n

      - name: Build web UI
        run: pnpm run build

      - name: Phone smoke test
        run: |
          pnpm exec playwright install --with-deps chromium
          pnpm run test:phone

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-36 build-tools;36.0.0"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build APK
        working-directory: android
        env:
          # Password of the release key (android/keystore/harbor-release.p12 or the secret below).
          # Without it the APK falls back to the debug key (updates then need a reinstall).
          HARBOR_KEYSTORE_PASSWORD: ${{ secrets.HARBOR_KEYSTORE_PASSWORD }}
          # Alternative to committing the key file: the .p12 itself, base64-encoded.
          HARBOR_KEYSTORE_BASE64: ${{ secrets.HARBOR_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$HARBOR_KEYSTORE_BASE64" ]; then
            echo "$HARBOR_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/harbor-release.p12"
            export HARBOR_KEYSTORE_PATH="$RUNNER_TEMP/harbor-release.p12"
          fi
          # A debug-signed APK can't update the installed app (Android refuses another key), so
          # without the release key nothing is built or published.
          if [ -z "$HARBOR_KEYSTORE_PASSWORD" ]; then
            echo "::error::HARBOR_KEYSTORE_PASSWORD secret is not set; refusing to publish a debug-signed APK."
            exit 1
          fi
          VERSION=$(node -p "require('../package.json').version")
          ./gradlew testReleaseUnitTest assembleRelease --no-daemon \
            -PharborVersionName="$VERSION" \
            -PharborVersionCode="${{ github.run_number }}"
          # Fixed file name so .../releases/latest/download/harbor-android.apk always works.
          mv app/build/outputs/apk/release/app-release.apk app/build/outputs/apk/release/harbor-android.apk
          echo "HARBOR_VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Verify APK
        env:
          # SHA-256 of the Harbor release certificate (android/keystore/harbor-release.p12, alias
          # "harbor"). After a key change, set the repository variable HARBOR_CERT_SHA256.
          EXPECTED_CERT: ${{ vars.HARBOR_CERT_SHA256 || '188b66718e6f00d5f0b382f9f2cd86b53250bd59a557a8a9ac4f17258903c620' }}
        run: |
          APK=android/app/build/outputs/apk/release/harbor-android.apk
          SIZE=$(stat -c %s "$APK")
          echo "APK: $SIZE bytes"
          if [ "$SIZE" -lt 5000000 ] || [ "$SIZE" -gt 200000000 ]; then
            echo "::error::unexpected APK size ($SIZE bytes)"
            exit 1
          fi
          APKSIGNER="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          [ -x "$APKSIGNER" ] || APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | tail -1)
          CERT=$("$APKSIGNER" verify --print-certs "$APK" | grep -m1 'certificate SHA-256 digest' | awk '{print $NF}')
          if [ "$CERT" != "$EXPECTED_CERT" ]; then
            echo "::error::the APK is not signed with the Harbor release key (certificate $CERT)"
            exit 1
          fi
          echo "HARBOR_APK_SHA256=$(sha256sum "$APK" | cut -d' ' -f1)" >> "$GITHUB_ENV"

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-v${{ env.HARBOR_VERSION }}-${{ github.run_number }}
          name: Harbor Android ${{ env.HARBOR_VERSION }} (build ${{ github.run_number }})
          target_commitish: ${{ github.sha }}
          # Only main is "latest" (the fixed .../releases/latest/download link). Other branches
          # publish test builds as pre-releases, so "latest" never points at one of them.
          make_latest: ${{ github.ref == 'refs/heads/main' && 'true' || 'false' }}
          prerelease: ${{ github.ref != 'refs/heads/main' }}
          body: |
            Android APK built from `${{ github.ref_name }}` @ ${{ github.sha }}.

            Download **harbor-android.apk** below, open it on your phone and allow
            "install from unknown sources" when Android asks.

            SHA-256: `${{ env.HARBOR_APK_SHA256 }}`
          files: android/app/build/outputs/apk/release/harbor-android.apk

      - uses: actions/upload-artifact@v4
        with:
          name: harbor-android-apk
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
